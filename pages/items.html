<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Master Item
            </h3>

            <div class="text-muted">
                Daftar item yang digunakan dalam inventory
            </div>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            onclick="openItemModal()">

            <i class="bi bi-plus-lg me-1"></i>
            Tambah Item

        </button>

    </div>


    <!-- SEARCH -->

    <div class="card dashboard-card mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">
                        Cari Item
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="itemSearch"
                            class="form-control"
                            placeholder="Cari kode atau nama item..."
                            oninput="filterItems()">

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="card dashboard-card">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th class="ps-3">
                                No
                            </th>

                            <th>
                                Kode Item
                            </th>

                            <th>
                                Nama Item
                            </th>

                            <th class="text-center">
                                Status
                            </th>

                            <th
                                class="text-center"
                                style="width: 150px;">
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="itemTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- MODAL ITEM -->

<div
    class="modal fade"
    id="itemModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title fw-bold"
                    id="itemModalTitle">

                    <i class="bi bi-box me-2"></i>
                    Tambah Item

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="itemId">


                <div class="mb-3">

                    <label class="form-label">
                        Kode Item
                    </label>

                    <input
                        type="text"
                        id="itemCode"
                        class="form-control"
                        maxlength="20"
                        placeholder="Contoh: POLY">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Nama Item
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        class="form-control"
                        maxlength="100"
                        placeholder="Contoh: Polyester">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        id="itemStatus"
                        class="form-select">

                        <option value="true">
                            Aktif
                        </option>

                        <option value="false">
                            Nonaktif
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveItem()">

                    <i class="bi bi-save me-1"></i>
                    Simpan

                </button>

            </div>

        </div>

    </div>

</div>
