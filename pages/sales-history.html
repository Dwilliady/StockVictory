<div class="container-fluid">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1">Riwayat Penjualan</h4>
            <div class="text-muted">
                Daftar transaksi penjualan
            </div>
        </div>

        <a
            href="app.html?page=sales"
            class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            Transaksi Baru
        </a>
    </div>


    <!-- FILTER -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3">

                <!-- SEARCH -->
                <div class="col-md-4">

                    <label class="form-label">
                        Cari
                    </label>

                    <input
                        type="text"
                        id="salesHistorySearch"
                        class="form-control"
                        placeholder="Invoice / Customer..."
                        oninput="filterSalesHistory()">

                </div>


                <!-- TANGGAL AWAL -->
                <div class="col-md-3">

                    <label class="form-label">
                        Dari Tanggal
                    </label>

                    <input
                        type="date"
                        id="salesHistoryDateFrom"
                        class="form-control"
                        onchange="filterSalesHistory()">

                </div>


                <!-- TANGGAL AKHIR -->
                <div class="col-md-3">

                    <label class="form-label">
                        Sampai Tanggal
                    </label>

                    <input
                        type="date"
                        id="salesHistoryDateTo"
                        class="form-control"
                        onchange="filterSalesHistory()">

                </div>


                <!-- RESET -->
                <div class="col-md-2 d-flex align-items-end">

                    <button
                        type="button"
                        class="btn btn-outline-secondary w-100"
                        onclick="resetSalesHistoryFilter()">

                        <i class="bi bi-arrow-counterclockwise me-1"></i>
                        Reset

                    </button>

                </div>

            </div>

        </div>
    </div>


    <!-- TABLE -->
    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th class="px-3">
                                Invoice
                            </th>

                            <th>
                                Tanggal
                            </th>

                            <th>
                                Customer
                            </th>

                            <th class="text-end">
                                Total
                            </th>

                            <th>
                                Dibuat Oleh
                            </th>

                            <th class="text-center">
                                Aksi
                            </th>

                        </tr>

                    </thead>

                    <tbody id="salesHistoryTableBody">

                        <tr>
                            <td
                                colspan="6"
                                class="text-center text-muted py-4">

                                Memuat data...

                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- DETAIL MODAL -->
<div
    class="modal fade"
    id="salesDetailModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <div>

                    <h5 class="modal-title">
                        Detail Penjualan
                    </h5>

                    <div
                        id="salesDetailInvoice"
                        class="text-muted small">
                    </div>

                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <!-- INFO -->
                <div class="row mb-4">

                    <div class="col-md-6">

                        <div class="text-muted small">
                            Customer
                        </div>

                        <div
                            id="salesDetailCustomer"
                            class="fw-semibold">
                            -
                        </div>

                    </div>


                    <div class="col-md-3">

                        <div class="text-muted small">
                            Tanggal
                        </div>

                        <div
                            id="salesDetailDate"
                            class="fw-semibold">
                            -
                        </div>

                    </div>


                    <div class="col-md-3">

                        <div class="text-muted small">
                            Dibuat Oleh
                        </div>

                        <div
                            id="salesDetailCreatedBy"
                            class="fw-semibold">
                            -
                        </div>

                    </div>

                </div>


                <!-- DETAIL TABLE -->
                <div class="table-responsive">

                    <table class="table table-bordered align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Item
                                </th>

                                <th>
                                    Warna
                                </th>

                                <th class="text-end">
                                    Qty
                                </th>

                                <th class="text-end">
                                    Harga
                                </th>

                                <th class="text-end">
                                    Subtotal
                                </th>

                            </tr>

                        </thead>

                        <tbody id="salesDetailTableBody">

                        </tbody>

                        <tfoot>

                            <tr>

                                <th
                                    colspan="4"
                                    class="text-end">

                                    Total

                                </th>

                                <th
                                    id="salesDetailTotal"
                                    class="text-end">

                                    Rp0

                                </th>

                            </tr>

                        </tfoot>

                    </table>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-outline-primary"
                    onclick="printSalesInvoice()">

                    <i class="bi bi-printer me-1"></i>
                    Print Invoice

                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Tutup

                </button>

            </div>

        </div>

    </div>

</div>
