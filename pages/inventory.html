<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Inventory
            </h3>

            <div class="text-muted">
                Daftar stock berdasarkan Item dan No. Warna
            </div>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            onclick="openAddStockModal()">

            <i class="bi bi-plus-lg me-1"></i>
            Tambah Stock

        </button>

    </div>

    <!-- INVENTORY GRID -->

    <div
        id="inventoryGrid"
        class="row g-4">
    </div>

</div>


<!-- MODAL TAMBAH STOCK -->

<div
    class="modal fade"
    id="addStockModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title fw-bold">
                    <i class="bi bi-plus-circle me-2"></i>
                    Tambah Stock
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Item
                    </label>

                    <select
                        id="stockItem"
                        class="form-select"
                        onchange="loadStockColors()">

                        <option value="">
                            -- Pilih Item --
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Warna
                    </label>

                    <select
                        id="stockColor"
                        class="form-select">

                        <option value="">
                            -- Pilih Warna --
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Jumlah Stock
                    </label>

                    <input
                        type="number"
                        id="stockQty"
                        class="form-control"
                        min="1"
                        placeholder="Masukkan jumlah stock">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Keterangan
                    </label>

                    <textarea
                        id="stockNotes"
                        class="form-control"
                        rows="3"
                        placeholder="Opsional">
                    </textarea>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveAddStock()">

                    <i class="bi bi-plus-lg me-1"></i>
                    Tambah Stock

                </button>

            </div>

        </div>

    </div>

</div>
