<div class="container-fluid">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="mb-1">
                Transaksi Penjualan
            </h4>

            <small class="text-muted">
                Input transaksi penjualan
            </small>
        </div>

    </div>


    <!-- INFORMASI TRANSAKSI -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-white">

            <h5 class="mb-0">
                Informasi Transaksi
            </h5>

        </div>


        <div class="card-body">

            <div class="row">

                <!-- CUSTOMER -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    <select
                        id="saleCustomer"
                        class="form-select">

                        <option value="">
                            -- Pilih Customer --
                        </option>

                    </select>

                </div>


                <!-- TANGGAL -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Tanggal Transaksi
                    </label>

                    <input
                        type="date"
                        id="saleDate"
                        class="form-control"
                        onchange="reloadSalePrices()">

                </div>

            </div>

        </div>

    </div>


    <!-- DETAIL PENJUALAN -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-white">

            <div
                class="d-flex
                       justify-content-between
                       align-items-center">

                <h5 class="mb-0">
                    Detail Penjualan
                </h5>


                <button
                    type="button"
                    class="btn btn-sm btn-primary"
                    onclick="addSaleRow()">

                    <i class="bi bi-plus-lg"></i>

                    Tambah Item

                </button>

            </div>

        </div>


        <div class="card-body p-0">

            <div class="table-responsive">

                <table
                    class="table
                           table-hover
                           align-middle
                           mb-0">

                    <thead class="table-light">

                        <tr>

                            <th style="min-width: 180px;">
                                Item
                            </th>

                            <th style="min-width: 180px;">
                                Warna
                            </th>

                            <th
                                class="text-end"
                                style="width: 120px;">

                                Stock

                            </th>

                            <th
                                style="width: 140px;">

                                Qty

                            </th>

                            <th
                                class="text-end"
                                style="width: 160px;">

                                Harga

                            </th>

                            <th
                                class="text-end"
                                style="width: 160px;">

                                Subtotal

                            </th>

                            <th
                                class="text-center"
                                style="width: 70px;">

                            </th>

                        </tr>

                    </thead>


                    <tbody id="saleDetailBody">

                        <!-- Row transaksi dibuat oleh JS -->

                    </tbody>


                    <tfoot>

                        <tr>

                            <td
                                colspan="5"
                                class="text-end fw-bold">

                                TOTAL

                            </td>

                            <td
                                class="text-end fw-bold"
                                id="saleTotal">

                                Rp0

                            </td>

                            <td></td>

                        </tr>

                    </tfoot>

                </table>

            </div>

        </div>

    </div>


    <!-- ACTION -->

    <div
        class="d-flex
               justify-content-end
               gap-2">

        <button
            type="button"
            class="btn btn-secondary"
            onclick="resetSaleForm()">

            Batal

        </button>


        <button
            type="button"
            id="btnSaveSale"
            class="btn btn-primary"
            onclick="saveSale()">

            <i class="bi bi-check-lg"></i>

            Simpan Transaksi

        </button>

    </div>

</div>

<!-- SALE SUCCESS MODAL -->
<div
    class="modal fade"
    id="saleSuccessModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="bi bi-check-circle-fill text-success me-2"></i>
                    Transaksi Berhasil
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body text-center">

                <div class="text-muted mb-1">
                    Invoice
                </div>

                <div
                    id="saleSuccessInvoice"
                    class="fw-bold fs-4 mb-3">
                    -
                </div>


                <div class="text-muted mb-1">
                    Total
                </div>

                <div
                    id="saleSuccessTotal"
                    class="fw-bold fs-3">
                    Rp0
                </div>

            </div>


            <div class="modal-footer justify-content-center">

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="printSavedSale()">

                    <i class="bi bi-printer me-1"></i>
                    Print Invoice

                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="finishSavedSale()">

                    Selesai

                </button>

            </div>

        </div>

    </div>

</div>
