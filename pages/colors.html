<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Master Warna
            </h3>

            <div class="text-muted">
                Daftar warna berdasarkan Item
            </div>
        </div>

        <button type="button"
                class="btn btn-primary"
                onclick="openColorModal()">

            <i class="bi bi-plus-lg me-1"></i>
            Tambah Warna

        </button>

    </div>


    <!-- SEARCH -->

    <div class="card dashboard-card mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-12 col-md-6">

                    <label class="form-label">
                        Cari
                    </label>

                    <input type="text"
                           id="colorSearch"
                           class="form-control"
                           placeholder="Cari No. Warna atau Nama Warna..."
                           oninput="filterColors()">

                </div>

            </div>

        </div>

    </div>


    <!-- GRID -->

    <div id="colorGrid" class="row g-4"></div>
    
</div>


<!-- MODAL TAMBAH / EDIT WARNA -->
<div class="modal fade"
     id="colorModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title fw-bold">
                    <i class="bi bi-palette me-2"></i>
                    <span id="colorModalTitle">Tambah Warna</span>
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <!-- FORM -->
                <div id="colorModalForm">

                    <input type="hidden" id="colorId">

                    <div class="mb-3">
                        <label class="form-label">
                            Item
                        </label>

                        <select id="colorItem"
                                class="form-select">

                            <option value="">
                                -- Pilih Item --
                            </option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            No. Warna
                        </label>

                        <input type="text"
                            id="colorNo"
                            class="form-control"
                            maxlength="10"
                            placeholder="Contoh: 001">
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Nama Warna
                        </label>

                        <input type="text"
                            id="colorName"
                            class="form-control"
                            maxlength="100"
                            placeholder="Contoh: Merah">
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        <select id="colorStatus"
                                class="form-select">

                            <option value="true">
                                Aktif
                            </option>

                            <option value="false">
                                Tidak Aktif
                            </option>

                        </select>
                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Batal
                </button>

                <button type="button"
                        class="btn btn-primary"
                        onclick="saveColor()">

                    <i class="bi bi-save me-1"></i>
                    Simpan

                </button>

            </div>

        </div>

    </div>

</div>
