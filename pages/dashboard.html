<div class="container-fluid">

    <div class="mb-4">

        <h3 class="fw-bold mb-1">
            Dashboard
        </h3>

        <div class="text-muted">
            Ringkasan inventory dan penjualan
        </div>

    </div>


    <div class="row g-3">

        <div class="col-12 col-md-6 col-xl-4">

            <div class="card dashboard-card">

                <div class="card-body">

                    <div class="text-muted">
                        Total Stock
                    </div>

                    <h2
                        id="totalStock"
                        class="fw-bold mt-2">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-12 col-md-6 col-xl-4">

            <div class="card dashboard-card">

                <div class="card-body">

                    <div class="text-muted">
                        Penjualan Hari Ini
                    </div>

                    <h2
                        id="todaySales"
                        class="fw-bold mt-2">
                        Rp 0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-12 col-md-6 col-xl-4">

            <div class="card dashboard-card">

                <div class="card-body">

                    <div class="text-muted">
                        Transaksi Hari Ini
                    </div>

                    <h2
                        id="todayTransactions"
                        class="fw-bold mt-2">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <div class="row g-4 mt-1">

    <div class="col-12 col-xl-7">
        <div class="card dashboard-card h-100">
            <div class="card-body">
                <h5 class="fw-bold mb-1">Penjualan YTD</h5>
                <div class="text-muted small mb-3">
                    Penjualan dari Januari sampai bulan berjalan
                </div>

                <div style="height: 320px;">
                    <canvas id="salesYtdChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-xl-5">
        <div class="card dashboard-card h-100">
            <div class="card-body">
                <h5 class="fw-bold mb-1">Penjualan MTD</h5>
                <div class="text-muted small mb-3">
                    Penjualan bulan berjalan
                </div>

                <div style="height: 320px;">
                    <canvas id="salesMtdChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>


    <div class="card dashboard-card mt-4">

        <div class="card-body">

            <h5 class="fw-bold">
                Penjualan Terbaru
            </h5>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>No Invoice</th>
                            <th>Customer</th>
                            <th>Tanggal</th>
                            <th>Status</th>
                            <th>Total</th>

                        </tr>

                    </thead>

                    <tbody id="recentSales">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
